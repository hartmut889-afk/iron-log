<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>鐵日誌</title>
<meta name="description" content="個人健身課表與訓練紀錄：規劃每日訓練、記錄最大重量與組數，內建 40 個動作的圖示、出力方向與動作要領。">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#F1EEE7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141412" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="鐵日誌">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<style>
/* ── reset (Artifact 版本由平台提供，獨立網頁要自己補) ── */
html,body{margin:0;padding:0}
img,svg{max-width:100%}
/* ── tokens: dark-first ─────────────────────────────── */
:root{
  color-scheme: dark light;
  --bg:#141412; --bg2:#1B1A17; --surface:#211F1C; --raised:#2A2723; --sunken:#0F0E0C;
  --line:#332F2A; --line2:#453F36;
  --text:#EFEBE3; --text2:#B2AA9E; --text3:#7B7466;
  --accent:#E5A44C; --accent2:#F1C489; --accentDim:rgba(229,164,76,.15);
  --ok:#8BAE68; --okDim:rgba(139,174,104,.16);
  --fig:#463F37; --figLine:#5C5347;
  --shadow:0 20px 50px rgba(0,0,0,.55);
  --scrim:rgba(8,7,6,.66);
  --warnBg:#3A2118; --warnLine:#5A3323; --warnText:#F0A98C;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F1EEE7; --bg2:#E9E5DC; --surface:#FFFFFF; --raised:#F8F5EF; --sunken:#E4DFD5;
    --line:#DFD8CB; --line2:#CBC2B2;
    --text:#221E18; --text2:#5C554A; --text3:#8A8174;
    --accent:#A96712; --accent2:#8A530C; --accentDim:rgba(169,103,18,.11);
    --ok:#587B39; --okDim:rgba(88,123,57,.12);
    --fig:#D3CCBE; --figLine:#B0A695;
    --shadow:0 18px 44px rgba(70,58,40,.16);
    --scrim:rgba(60,52,40,.42);
    --warnBg:#FBE7DC; --warnLine:#E9C3AF; --warnText:#8E3B18;
  }
}
:root[data-theme="light"]{
  --bg:#F1EEE7; --bg2:#E9E5DC; --surface:#FFFFFF; --raised:#F8F5EF; --sunken:#E4DFD5;
  --line:#DFD8CB; --line2:#CBC2B2;
  --text:#221E18; --text2:#5C554A; --text3:#8A8174;
  --accent:#A96712; --accent2:#8A530C; --accentDim:rgba(169,103,18,.11);
  --ok:#587B39; --okDim:rgba(88,123,57,.12);
  --fig:#D3CCBE; --figLine:#B0A695;
  --shadow:0 18px 44px rgba(70,58,40,.16);
  --scrim:rgba(60,52,40,.42);
  --warnBg:#FBE7DC; --warnLine:#E9C3AF; --warnText:#8E3B18;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Hiragino Sans TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  font-size:15px; line-height:1.55; overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
:where(button,input,select,textarea){font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
::selection{background:var(--accentDim)}

.serif{font-family:"Songti TC","Noto Serif TC","Source Han Serif TC",Georgia,"Times New Roman",serif}
.num{font-family:ui-monospace,"SF Mono","JetBrains Mono","Roboto Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.lbl{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--text3);font-weight:600}

/* ── shell ───────────────────────────────────────────── */
#app{max-width:520px;margin:0 auto;min-height:100dvh;background:var(--bg);position:relative;
  padding-bottom:calc(104px + env(safe-area-inset-bottom))}

.topbar{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top)}

/* 保存失敗警告：寧可吵，也不要安靜地弄丟資料 */
.warn[hidden]{display:none}
.warn{display:flex;align-items:center;gap:10px;padding:9px 16px 10px;
  background:var(--warnBg);border-bottom:1px solid var(--warnLine);color:var(--warnText)}
.warn svg{flex:none}
.warn .wt{flex:1;min-width:0;font-size:12.5px;line-height:1.45}
.warn .wt b{display:block;font-size:13.5px;font-weight:700;letter-spacing:.01em}
.warn .wt span{color:var(--warnText);opacity:.82}
.warn button{flex:none;font-size:12px;font-weight:700;padding:6px 12px;border-radius:8px;
  border:1px solid currentColor;color:inherit}
.warn button:hover{background:rgba(255,255,255,.1)}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-14px;height:14px;background:linear-gradient(var(--bg),transparent);pointer-events:none}
.tbrow{display:flex;align-items:center;gap:10px;padding:12px 16px 6px}
.month{font-size:17px;font-weight:600;letter-spacing:.01em}
.month small{color:var(--text3);font-weight:500;font-size:12px;margin-left:6px;letter-spacing:.06em}
.tbspace{flex:1}
.iconbtn{width:32px;height:32px;display:grid;place-items:center;border-radius:9px;color:var(--text2);border:1px solid transparent}
.iconbtn:hover{background:var(--raised);color:var(--text)}
.todaybtn{font-size:12px;font-weight:600;padding:5px 11px;border-radius:99px;border:1px solid var(--line2);color:var(--text2)}
.todaybtn:hover{color:var(--accent);border-color:var(--accent)}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:2px 10px 10px}
.day{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 8px;border-radius:12px;border:1px solid transparent;transition:background .14s}
.day .wd{font-size:10px;color:var(--text3);letter-spacing:.06em}
.day .dd{font-size:16px;font-weight:600;line-height:1.1}
.day .dot{width:4px;height:4px;border-radius:99px;background:var(--text3);margin-top:1px}
.day .dot.full{background:var(--ok)}
.day .dot.none{background:transparent}
.day:hover{background:var(--bg2)}
.day.today .dd{color:var(--accent)}
.day.sel{background:var(--surface);border-color:var(--line2)}
.day.sel .dd{color:var(--text)}
.day.sel.today .dd{color:var(--accent)}
.day.sel::after{content:"";position:absolute;left:50%;translate:-50% 0;bottom:-1px;width:18px;height:2px;border-radius:2px;background:var(--accent)}

/* ── day header ──────────────────────────────────────── */
main{padding:18px 16px 0;animation:slidein .22s ease}
@keyframes slidein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.dayhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.dayttl{font-size:27px;line-height:1.12;letter-spacing:.01em}
.dayttl .wk{display:block;font-size:11.5px;letter-spacing:.22em;color:var(--text3);font-family:inherit;margin-bottom:5px}
.focus{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;max-width:46%}
.ptag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;white-space:nowrap}

.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);margin-bottom:18px}
.stat{padding:11px 12px 12px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat .v{font-size:19px;font-weight:600;line-height:1.15}
.stat .v em{font-style:normal;font-size:11px;color:var(--text3);margin-left:2px;font-weight:500}
.stat .k{font-size:10.5px;color:var(--text3);letter-spacing:.1em;margin-top:2px}
.stat.done .v{color:var(--ok)}

/* ── cards ───────────────────────────────────────────── */
.cards{display:flex;flex-direction:column;gap:10px}
.card{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:11px 13px 11px 9px;text-align:left;width:100%;transition:border-color .15s,transform .1s}
.card:hover{border-color:var(--line2)}
.card:active{transform:scale(.994)}
.card.complete{border-color:color-mix(in srgb,var(--ok) 42%,var(--line))}
.thumb{width:56px;height:74px;border-radius:11px;background:var(--sunken);display:grid;place-items:center;position:relative;overflow:hidden;border:1px solid var(--line)}
.thumb svg{width:100%;height:100%;display:block}
.thumb .mag{position:absolute;right:3px;bottom:3px;font-size:9px;color:var(--text3);background:var(--surface);border-radius:5px;padding:0 3px;line-height:13px}
.cbody{min-width:0}
.cname{font-size:15.5px;font-weight:600;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmeta{display:flex;align-items:center;gap:7px;margin-top:3px;flex-wrap:wrap}
.cdot{width:6px;height:6px;border-radius:99px;flex:none}
.cequip{font-size:11.5px;color:var(--text3)}
.cscheme{margin-top:6px;font-size:13px;color:var(--text2)}
.cscheme b{color:var(--text);font-weight:600}
.ring{width:38px;height:38px;flex:none}
.ring text{font-size:11px;font-weight:700;fill:var(--text2)}
.ring.done text{fill:var(--ok)}

.empty{border:1px dashed var(--line2);border-radius:16px;padding:30px 22px;text-align:center;background:var(--bg2)}
.empty h3{margin:0 0 6px;font-size:17px;font-weight:600}
.empty p{margin:0 0 16px;color:var(--text3);font-size:13px;line-height:1.7}
.empty .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

.btn{border:1px solid var(--line2);border-radius:10px;padding:8px 14px;font-size:13.5px;font-weight:600;color:var(--text);transition:background .14s,border-color .14s}
.btn:hover{background:var(--raised)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#17130C}
.btn.pri:hover{background:var(--accent2);border-color:var(--accent2)}
.btn.gho{border-color:transparent;color:var(--text3)}
.btn.gho:hover{color:var(--text);background:var(--raised)}
.btn.dgr{color:#D2705E;border-color:transparent}
.btn.dgr:hover{background:rgba(210,112,94,.12)}
.btn[disabled]{opacity:.4;pointer-events:none}

.dayfoot{display:flex;gap:8px;margin:16px 0 4px;flex-wrap:wrap}

/* ── FAB ─────────────────────────────────────────────── */
.fabwrap{position:fixed;right:max(16px,calc(50vw - 244px));z-index:40;display:flex;flex-direction:column;align-items:flex-end;gap:9px;
  bottom:max(22px,calc(env(safe-area-inset-bottom) + 14px))}
.fab{width:56px;height:56px;border-radius:19px;background:var(--accent);color:#17130C;display:grid;place-items:center;box-shadow:var(--shadow);transition:transform .18s cubic-bezier(.34,1.4,.5,1)}
.fab:hover{transform:translateY(-2px)}
.fab svg{transition:rotate .2s}
.fabwrap.open .fab svg{rotate:135deg}
.mini{display:flex;align-items:center;gap:9px;opacity:0;pointer-events:none;transform:translateY(8px) scale(.95);transition:all .18s}
.fabwrap.open .mini{opacity:1;pointer-events:auto;transform:none}
.fabwrap.open .mini:nth-child(1){transition-delay:.05s}
.mini span{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:12.5px;font-weight:600;box-shadow:var(--shadow);white-space:nowrap}
.mini i{width:40px;height:40px;border-radius:13px;background:var(--surface);border:1px solid var(--line2);display:grid;place-items:center;box-shadow:var(--shadow);color:var(--text2)}
.mini:hover i{color:var(--accent);border-color:var(--accent)}

/* ── sheets ──────────────────────────────────────────── */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;opacity:0;pointer-events:none;transition:opacity .22s;backdrop-filter:blur(2px)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;max-width:520px;margin:0 auto;
  background:var(--bg2);border:1px solid var(--line2);border-bottom:0;border-radius:22px 22px 0 0;
  max-height:92dvh;display:flex;flex-direction:column;transform:translateY(102%);transition:transform .28s cubic-bezier(.3,.9,.3,1);box-shadow:var(--shadow)}
.sheet.on{transform:none}
.grab{width:34px;height:4px;border-radius:99px;background:var(--line2);margin:9px auto 0;flex:none}
.shead{display:flex;align-items:center;gap:10px;padding:10px 16px 12px;border-bottom:1px solid var(--line);flex:none}
.shead h2{margin:0;font-size:17px;font-weight:600;letter-spacing:.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbody{overflow-y:auto;overscroll-behavior:contain;padding:16px;-webkit-overflow-scrolling:touch}
.sfoot{flex:none;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg2);display:flex;gap:8px}
.sfoot .btn{flex:1;text-align:center;padding:11px}

/* ── detail sheet ────────────────────────────────────── */
.dtop{display:grid;grid-template-columns:96px 1fr;gap:14px;margin-bottom:18px}
.dfig{width:96px;height:132px;border-radius:13px;background:var(--sunken);border:1px solid var(--line);overflow:hidden;position:relative}
.dfig svg{width:100%;height:100%;display:block}
.dfig .hint{position:absolute;left:0;right:0;bottom:0;font-size:9.5px;text-align:center;color:var(--text3);background:linear-gradient(transparent,var(--sunken) 60%);padding:8px 0 3px;letter-spacing:.05em}
.prgrid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;align-self:start}
.prcell{background:var(--surface);padding:9px 11px 10px}
.prcell .k{font-size:10px;letter-spacing:.1em;color:var(--text3)}
.prcell .v{font-size:21px;font-weight:700;line-height:1.2;margin-top:1px}
.prcell .v em{font-style:normal;font-size:11px;font-weight:500;color:var(--text3);margin-left:2px}
.prcell.hi .v{color:var(--accent)}
.lastlog{grid-column:1/-1;background:var(--surface);padding:8px 11px;font-size:12px;color:var(--text2);display:flex;gap:8px;align-items:baseline}
.lastlog b{color:var(--text);font-weight:600}

.sect{margin-top:20px}
.sect:first-child{margin-top:0}
.secth{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
.secth .lbl{flex:none}
.secth .rule{flex:1;height:1px;background:var(--line)}

.sets{display:flex;flex-direction:column;gap:6px}
.setrow{display:grid;grid-template-columns:26px 1fr 12px 1fr 38px 26px;gap:6px;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:6px 7px}
.setrow.on{border-color:color-mix(in srgb,var(--ok) 48%,var(--line));background:var(--okDim)}
.setrow.warm{opacity:.62}
.setrow.warm .setno{font-size:10px;letter-spacing:.02em}
.setno{font-size:11px;color:var(--text3);text-align:center;font-weight:600}
.setrow.on .setno{color:var(--ok)}
.setrow.amrap .fld input[data-f="r"]::placeholder{color:var(--accent);font-weight:700;opacity:1}
.fld{position:relative}
.fld input{width:100%;background:var(--sunken);border:1px solid var(--line);border-radius:8px;padding:7px 28px 7px 9px;font-size:15px;font-weight:600;
  font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums;text-align:right;-moz-appearance:textfield}
.fld input::-webkit-outer-spin-button,.fld input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.fld input:focus{border-color:var(--accent);outline:none}
.fld u{position:absolute;right:8px;top:50%;translate:0 -50%;font-size:10px;color:var(--text3);text-decoration:none;pointer-events:none}
.setx{text-align:center;color:var(--text3);font-size:12px}
.chk{width:34px;height:34px;border-radius:9px;border:1px solid var(--line2);display:grid;place-items:center;color:var(--text3);justify-self:center}
.chk:hover{border-color:var(--ok);color:var(--ok)}
.setrow.on .chk{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.del{color:var(--text3);display:grid;place-items:center;height:30px;border-radius:7px}
.del:hover{color:#D2705E;background:rgba(210,112,94,.1)}
.addset{margin-top:8px;width:100%;border:1px dashed var(--line2);border-radius:11px;padding:9px;font-size:13px;font-weight:600;color:var(--text3)}
.addset:hover{color:var(--accent);border-color:var(--accent)}

.mix{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mixr{display:block;background:var(--surface);padding:10px 13px 11px;text-align:left;width:100%}
.mixr:hover{background:var(--raised)}
.mixr .g{font-size:13.5px;font-weight:700}
.mixr .s{font-size:11.5px;color:var(--text3)}
.mixr .plan{display:inline-block;margin-top:6px;font-size:13px;font-weight:600;color:var(--accent);letter-spacing:-.01em}
.mixr .w{font-size:15px;font-weight:700}
.mixr .w em{font-style:normal;font-size:10px;color:var(--text3);font-weight:500;margin-left:2px}
.mixnote{font-size:11.5px;color:var(--text3);margin-top:8px;line-height:1.6}

.maxform{margin-top:10px;background:var(--surface);border:1px solid var(--line2);border-radius:12px;padding:12px}
.maxrow{display:grid;grid-template-columns:1fr 14px 1fr;gap:8px;align-items:center}
.maxrow .fld input{text-align:right}
.restrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{border:1px solid var(--line2);border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:600;color:var(--text2)}
.pill.on{background:var(--accentDim);border-color:var(--accent);color:var(--accent)}

/* ── intro sheet ─────────────────────────────────────── */
.bigfig{background:var(--sunken);border:1px solid var(--line);border-radius:16px;padding:6px;display:grid;grid-template-columns:1fr 1fr;gap:4px}
.bigfig.one{grid-template-columns:1fr}
.bigfig figure{margin:0;display:flex;flex-direction:column;align-items:center}
.bigfig svg{width:100%;height:auto;max-height:250px;display:block}
.bigfig.one .artwrap{position:relative;width:100%;aspect-ratio:3/4;max-height:56dvh}
.bigfig.one .artwrap svg.fig{max-height:none}
.bigfig.one .artimg{object-fit:contain}
.bigfig figcaption{font-size:10px;letter-spacing:.14em;color:var(--text3);padding-bottom:5px}
.legend{display:flex;gap:14px;justify-content:center;padding:8px 0 2px;flex-wrap:wrap}
.legend i{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--text3);font-style:normal}
.legend i b{width:9px;height:9px;border-radius:3px;display:inline-block}

.force{display:flex;gap:11px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:11px;padding:11px 13px}
.force .fdir{font-size:15px;font-weight:700;color:var(--accent);white-space:nowrap}
.force .fnote{font-size:13px;color:var(--text2);line-height:1.65}

.mchips{display:flex;flex-wrap:wrap;gap:6px}
.mchip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;border:1px solid var(--accent);color:var(--accent);background:var(--accentDim)}
.mchip.sec{border-color:var(--line2);color:var(--text3);background:transparent;font-weight:500}

ol.cues{margin:0;padding:0;list-style:none;counter-reset:c;display:flex;flex-direction:column;gap:9px}
ol.cues li{counter-increment:c;display:grid;grid-template-columns:20px 1fr;gap:10px;font-size:13.5px;line-height:1.7;color:var(--text2)}
ol.cues li::before{content:counter(c,decimal-leading-zero);font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:var(--accent);padding-top:4px;font-weight:700}
ul.bad{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
ul.bad li{display:grid;grid-template-columns:14px 1fr;gap:10px;font-size:13px;line-height:1.65;color:var(--text2)}
ul.bad li::before{content:"×";color:#D2705E;font-weight:700;text-align:center;padding-top:1px}
.breath{font-size:13px;color:var(--text2);background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px 13px;line-height:1.65}

/* ── library ─────────────────────────────────────────── */
.search{width:100%;background:var(--sunken);border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-size:14px}
.search:focus{border-color:var(--accent);outline:none}
.filters{display:flex;gap:6px;overflow-x:auto;padding:11px 0 3px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters .pill{flex:none}
.exlist{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.exrow{display:grid;grid-template-columns:46px 1fr 24px;gap:11px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:7px 10px 7px 7px;text-align:left;width:100%}
.exrow:hover{border-color:var(--line2)}
.exrow.sel{border-color:var(--accent);background:var(--accentDim)}
.exthumb{width:46px;height:62px;border-radius:9px;background:var(--sunken);overflow:hidden;border:1px solid var(--line)}
.exthumb svg{width:100%;height:100%;display:block}
.exrow .n{font-size:14.5px;font-weight:600}
.exrow .m{font-size:11px;color:var(--text3);margin-top:1px;display:flex;align-items:center;gap:6px}
.tick{width:22px;height:22px;border-radius:7px;border:1px solid var(--line2);display:grid;place-items:center;color:transparent}
.exrow.sel .tick{background:var(--accent);border-color:var(--accent);color:#17130C}
.nores{text-align:center;color:var(--text3);font-size:13px;padding:26px 0}

/* ── list rows (templates / copy / settings) ─────────── */
.rows{display:flex;flex-direction:column;gap:7px}
.row{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;text-align:left;width:100%}
.row:hover{border-color:var(--line2)}
.row .g{flex:1;min-width:0}
.row .t{font-size:14.5px;font-weight:600}
.row .s{font-size:11.5px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .act{flex:none;color:var(--text3)}
.row .act:hover{color:#D2705E}
.swatch{width:8px;align-self:stretch;border-radius:99px;flex:none;min-height:30px}
.hintbox{font-size:12px;color:var(--text3);line-height:1.75;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-top:12px}
.backup{width:100%;min-height:120px;background:var(--sunken);border:1px solid var(--line);border-radius:11px;padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:11px;resize:vertical;margin-top:8px}

.toast{position:fixed;left:50%;bottom:96px;translate:-50% 0;z-index:80;background:var(--raised);border:1px solid var(--line2);
  border-radius:11px;padding:9px 16px;font-size:13px;font-weight:600;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s,translate .2s;
  display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;translate:-50% -6px;pointer-events:auto}
.toast .tact{flex:none;color:var(--accent);font-weight:700;font-size:13px;padding:3px 4px;border-radius:6px}
.toast .tact:hover{background:var(--accentDim)}

@media (max-width:360px){
  .dayttl{font-size:23px}
  .setrow{grid-template-columns:22px 1fr 10px 1fr 34px 22px;gap:4px}
}
@media (prefers-reduced-motion:reduce){

}

    eq:['cableTopShort'], ar:[{at:'chest',d:[-.55,.84],l:20,c:-7}]},
 d:[3,15,60]},

{id:'russian', n:'俄羅斯轉體', en:'Russian Twist', part:'core', eq:'dumbbell',
 pri:['obl'], sec:['abs','hipf'], force:'軀幹旋轉',
 fn:'坐姿後仰，雙手持重物左右轉動軀幹。',
 cues:['上身後仰約 45 度並保持','用胸口帶動旋轉，不是只有手在移動','轉到底停一拍再換邊','雙腳離地難度更高'],
 bad:['只有手臂左右擺，軀幹沒轉','背部彎曲讓腰椎旋轉受壓'],
 br:'每轉一邊吐一次氣',
 f:{v:'front', p:P({torso:216, sh:[96,96], el:[112,112], hip:[62,62], kn:[18,18], dy:2, s:.84}),
    eq:['dbHands'], ar:[{at:'bar',d:[.2,-.98],l:18,c:11},{at:'bar',d:[.2,.98],l:18,c:-11}]},
 d:[3,20,45]},

{id:'abwheel', n:'健腹輪', en:'Ab Wheel Rollout', part:'core', eq:'body',
 pri:['abs'], sec:['obl','lat','del','esp'], force:'抗伸展',
 fn:'跪姿推輪向前，核心對抗腰椎被拉開的力量再收回。',
 cues:['起始先捲尾骨，讓腰呈微駝','推出到核心快撐不住就回來','手臂保持伸直','進步靠增加距離，不是次數'],
 bad:['推太遠導致腰塌下去','用手臂拉回而不是用腹部'],

 f:{v:'front', p:P({torso:-118, sh:[-20,-20], el:[-20,-20], hip:[50,50], kn:[88,88], dy:2, s:.84}),
    eq:['wheel','floor'], ar:[{at:'handR',d:[-1,0],l:18},{at:'chest',d:[.3,-.95],l:16}]},
 d:[3,10,75]},

{id:'sideplank', n:'側棒式', en:'Side Plank', part:'core', eq:'body',
 pri:['obl'], sec:['abs','glu','sdel'], force:'抗側屈等長',
 fn:'單側前臂撐地，身體側面成一直線對抗骨盆下沉。',
 cues:['手肘在肩膀正下方','把髖部主動往上頂','頭、肩、髖、踝在同一直線','兩側都要練，時間對等'],
 bad:['髖部下沉讓腰側塌陷','身體往前後翻轉失去側向'],
 br:'穩定淺呼吸，不憋氣',

    eq:['floor'], ar:[{at:'hip',d:[0,-1],l:18}]},

/* 內建 40 個動作都有解剖插畫（img/<id>.webp，檔名同 id）。
   自訂動作沒有圖，會退回 figureSVG() 畫的人形示意圖；插畫載不到時也一樣。 */
DB.forEach(e=>{ if(!e.custom) e.art=e.id; });

const BYID = Object.fromEntries(DB.map(e=>[e.id,e]));

/* ═══════════════════════════════════════════════════════
   2. 人形繪圖引擎（參數化 SVG）
   ═══════════════════════════════════════════════════════ */
const RAD=Math.PI/180, PVX=50, PVY=82;
const L={ua:19,fa:17,th:25,sk:25,to:36,hd:7.4,shW:13,hpW:7.5};
const dir=a=>({x:Math.sin(a*RAD),y:Math.cos(a*RAD)});
const add=(p,d,n)=>({x:p.x+d.x*n,y:p.y+d.y*n});
const r1=n=>Math.round(n*10)/10;

function joints(p){
  const s=p.s||1, dx=p.dx||0, dy=p.dy||0;
  const pv={x:PVX,y:PVY};
  const td=dir(p.torso);
  const neck=add(pv,td,L.to*s);
  const pl={x:td.y,y:-td.x};                     // torso perpendicular (左側)
  const pr={x:-td.y,y:td.x};
  const j={
    pelvis:pv, neck,
    shoulderL:add(neck,pl,L.shW*s), shoulderR:add(neck,pr,L.shW*s),
    hipL:add(pv,pl,L.hpW*s), hipR:add(pv,pr,L.hpW*s),
    head:add(neck,td,(L.hd+3.6)*s)
  };
  j.elbowL=add(j.shoulderL,dir(p.sh[0]),L.ua*s);
  j.elbowR=add(j.shoulderR,dir(p.sh[1]),L.ua*s);
  j.handL =add(j.elbowL,  dir(p.el[0]),L.fa*s);
  j.handR =add(j.elbowR,  dir(p.el[1]),L.fa*s);
  j.kneeL =add(j.hipL,    dir(p.hip[0]),L.th*s);
  j.kneeR =add(j.hipR,    dir(p.hip[1]),L.th*s);
  j.footL =add(j.kneeL,   dir(p.kn[0]),L.sk*s);
  j.footR =add(j.kneeR,   dir(p.kn[1]),L.sk*s);
  j.chest =add(neck,{x:-td.x,y:-td.y},9*s);
  j.hip   =pv;
  j.bar   ={x:(j.handL.x+j.handR.x)/2,y:(j.handL.y+j.handR.y)/2};
  j.center={x:PVX,y:PVY-16};
  for(const k in j){ j[k]={x:r1(j[k].x+dx), y:r1(j[k].y+dy)}; }
  j._s=s; j._td=td;
  return j;
}

/* 軀幹肌群路徑（局部座標：骨盆 0,0 → 頸部 0,-36） */
const TORSO_OUT='M -13.2,-35 Q -14,-22 -10.6,-1.5 L 10.6,-1.5 Q 14,-22 13.2,-35 Q 0,-31 -13.2,-35 Z';
const TP={
  ch:'M -12,-33.4 Q -2.4,-31.6 -1.6,-21.6 Q -8,-18.6 -12.2,-24.4 Z|mirror',
  uch:'M -11.8,-33.8 Q -2,-31.4 -1.6,-26.6 Q -7.4,-27.4 -12,-29.6 Z|mirror',
  abs:'M -5.4,-20.4 Q 0,-21.2 5.4,-20.4 L 4.6,-2.6 Q 0,-1.4 -4.6,-2.6 Z',
  obl:'M -10.6,-19.6 Q -6.6,-18.6 -6.2,-12.6 L -8.6,-2.8 Q -10.4,-10 -10.6,-19.6 Z|mirror',
  lat:'M -12.6,-30.4 Q -13.4,-16 -6.4,-5.6 L -8.4,-16 L -8.6,-31 Z|mirror',
  tra:'M -9.6,-35.6 Q 0,-30.4 9.6,-35.6 L 12.6,-32.6 Q 0,-25.4 -12.6,-32.6 Z',
  rho:'M -8,-30.6 L 8,-30.6 L 6,-19.6 L -6,-19.6 Z',
  esp:'M -5.2,-22.6 L -1.4,-22.6 L -1.8,-2.6 L -5.6,-2.6 Z|mirror',
  ser:'M -11.6,-24.4 L -6.6,-22.6 L -7,-19.4 L -11.4,-21 Z|mirror'
};
function torsoPaths(ids,cls){
  let out='';
  for(const id of ids){
    const raw=TP[id]; if(!raw) continue;
    const [d,mir]=raw.split('|');
    out+=`<path class="${cls}" d="${d}"/>`;
    if(mir==='mirror') out+=`<path class="${cls}" d="${d}" transform="scale(-1,1)"/>`;
  }
  return out;
}

function seg(a,b,w,cls){ return `<line class="${cls}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke-width="${w}"/>`; }

function arrow(from,d,len,curve,w){
  const n=Math.hypot(d[0],d[1])||1, ux=d[0]/n, uy=d[1]/n;
  const A={x:from.x+ux*7, y:from.y+uy*7};
  const B={x:A.x+ux*len, y:A.y+uy*len};
  const c=curve||0;
  const C={x:(A.x+B.x)/2 - uy*c, y:(A.y+B.y)/2 + ux*c};
  const hd={x:B.x-C.x, y:B.y-C.y}, hn=Math.hypot(hd.x,hd.y)||1;
  const hx=hd.x/hn, hy=hd.y/hn, s=4.4;
  const p1={x:B.x-hx*s-hy*s*.62, y:B.y-hy*s+hx*s*.62};
  const p2={x:B.x-hx*s+hy*s*.62, y:B.y-hy*s-hx*s*.62};
  return `<path class="ar" d="M ${r1(A.x)},${r1(A.y)} Q ${r1(C.x)},${r1(C.y)} ${r1(B.x)},${r1(B.y)}" stroke-width="${w}"/>`
       + `<path class="arh" d="M ${r1(B.x)},${r1(B.y)} L ${r1(p1.x)},${r1(p1.y)} L ${r1(p2.x)},${r1(p2.y)} Z"/>`;
}

/* 器材零件 */
function gear(kind,j){
  const s=j._s, g=[];
  const bar=(c,half,plate)=>{
    g.push(`<line class="eq" x1="${c.x-half}" y1="${c.y}" x2="${c.x+half}" y2="${c.y}" stroke-width="2.6"/>`);
    if(plate!==false){
      [-1,1].forEach(k=>g.push(`<rect class="eqf" x="${c.x+k*half-(k>0?4.5:0)}" y="${c.y-8}" width="4.5" height="16" rx="1.4"/>`));
    }
  };
  const dbAt=p=>{
    g.push(`<line class="eq" x1="${p.x-6.5}" y1="${p.y}" x2="${p.x+6.5}" y2="${p.y}" stroke-width="2.2"/>`);
    [-1,1].forEach(k=>g.push(`<rect class="eqf" x="${p.x+k*6.5-(k>0?3.4:0)}" y="${p.y-5}" width="3.4" height="10" rx="1.2"/>`));
  };
  const line=(a,b,w,c)=>g.push(`<line class="${c||'eq'}" x1="${r1(a.x)}" y1="${r1(a.y)}" x2="${r1(b.x)}" y2="${r1(b.y)}" stroke-width="${w||2}"/>`);
  const hm={x:(j.handL.x+j.handR.x)/2,y:(j.handL.y+j.handR.y)/2};

  switch(kind){
    case 'bar': bar(hm,24*s); break;
    case 'barHands': bar(hm,22*s); break;
    case 'barGround': bar({x:hm.x,y:Math.max(hm.y,j.footL.y-2)},24*s); break;
    case 'barBack': bar({x:j.neck.x,y:j.neck.y+1},25*s); break;
    case 'barFront': bar({x:j.neck.x+3,y:j.neck.y+3},23*s); break;
    case 'db': dbAt(j.handL); dbAt(j.handR); break;
    case 'dbR': dbAt(j.handR); break;
    case 'dbHands': dbAt(hm); break;
    case 'dbTop': dbAt(hm); break;
    case 'bench': {
      const td=j._td, n={x:-td.y,y:td.x};
      const flip=((j.bar.x-j.pelvis.x)*n.x+(j.bar.y-j.pelvis.y)*n.y)>0?-1:1;
      const o=11*s, a=add(add(j.pelvis,n,o*flip),td,-6*s), b=add(add(j.neck,n,o*flip),td,9*s);
      line(a,b,7,'eqf2'); break;
    }
    case 'benchInc': {
      const td=j._td, n={x:-td.y,y:td.x};
      const flip=((j.bar.x-j.pelvis.x)*n.x+(j.bar.y-j.pelvis.y)*n.y)>0?-1:1;
      const o=11*s, a=add(add(j.pelvis,n,o*flip),td,-8*s), b=add(add(j.neck,n,o*flip),td,7*s);
      line(a,b,7,'eqf2');
      line(a,{x:a.x,y:a.y+16},3,'eq'); break;
    }
    case 'benchLow': line({x:j.kneeL.x-14,y:j.kneeL.y+2},{x:j.kneeL.x+16,y:j.kneeL.y+2},6,'eqf2'); break;
    case 'benchBack': line({x:j.footR.x-6,y:j.footR.y+2},{x:j.footR.x+12,y:j.footR.y+2},6,'eqf2'); break;
    case 'seat': line({x:j.pelvis.x-13,y:j.pelvis.y+7},{x:j.pelvis.x+15,y:j.pelvis.y+7},6,'eqf2'); break;
    case 'seatBack':
      line({x:j.pelvis.x-14,y:j.pelvis.y+7},{x:j.pelvis.x+14,y:j.pelvis.y+7},6,'eqf2');
      line({x:j.pelvis.x+11,y:j.pelvis.y+5},{x:j.neck.x+11,y:j.neck.y+4},6,'eqf2'); break;
    case 'pressSeat': {
      const td=j._td, n={x:-td.y,y:td.x};
      const a=add(add(j.pelvis,n,12*s),td,-4*s), b=add(add(j.neck,n,12*s),td,6*s);
      line(a,b,7,'eqf2'); break;
    }
    case 'plate': g.push(`<rect class="eqf" x="${j.footR.x-2}" y="${j.footR.y-16}" width="6" height="30" rx="2"/>`); break;
    case 'pad': line({x:j.footR.x-4,y:j.footR.y},{x:j.footR.x+5,y:j.footR.y},7,'eqf2'); break;
    case 'preachPad': line({x:j.elbowL.x-3,y:j.elbowL.y+5},{x:j.bar.x+2,y:j.bar.y+9},7,'eqf2'); break;
    case 'pullbar': bar({x:hm.x,y:hm.y-1},26*s,false);
      line({x:hm.x-26*s,y:hm.y-1},{x:hm.x-26*s,y:hm.y-11},2.4);
      line({x:hm.x+26*s,y:hm.y-1},{x:hm.x+26*s,y:hm.y-11},2.4); break;
    case 'dipbar':
      line({x:j.handL.x-9,y:j.handL.y},{x:j.handL.x+5,y:j.handL.y},2.6);
      line({x:j.handR.x-5,y:j.handR.y},{x:j.handR.x+9,y:j.handR.y},2.6); break;
    case 'step': line({x:j.footL.x-9,y:j.footL.y+3},{x:j.footR.x+9,y:j.footR.y+3},5,'eqf2'); break;
    case 'floor': line({x:6,y:Math.max(j.handR.y,j.footR.y)+3},{x:94,y:Math.max(j.handR.y,j.footR.y)+3},2,'eqf3'); break;
    case 'wheel': g.push(`<circle class="eqf" cx="${j.handR.x}" cy="${j.handR.y+3}" r="5.4"/>`); break;
    case 'cableHigh':
      [[j.handL,-1],[j.handR,1]].forEach(([h,k])=>{
        const an={x:50+k*40,y:16};
        line(an,h,1.4,'cab'); g.push(`<circle class="eqf" cx="${an.x}" cy="${an.y}" r="3.4"/>`);
      }); break;
    case 'cableHighFront': { const an={x:50,y:14}; line(an,j.handL,1.4,'cab'); line(an,j.handR,1.4,'cab');
      g.push(`<circle class="eqf" cx="${an.x}" cy="${an.y}" r="3.4"/>`); break; }
    case 'cableTop': { const an={x:hm.x,y:10}; line(an,hm,1.4,'cab'); g.push(`<circle class="eqf" cx="${an.x}" cy="${an.y}" r="3.4"/>`); break; }
    case 'cableTopShort': { const an={x:hm.x,y:12}; line(an,hm,1.4,'cab'); g.push(`<circle class="eqf" cx="${an.x}" cy="${an.y}" r="3.4"/>`); break; }
    case 'cableLowFront': { const an={x:14,y:hm.y+10}; line(an,hm,1.4,'cab'); g.push(`<circle class="eqf" cx="${an.x}" cy="${an.y}" r="3.4"/>`); break; }
  }
  return g.join('');
}

/* 插畫層：SVG 永遠先畫在底下當後備，插畫載入成功才蓋上去。
   圖檔 404（離線未快取、Artifact 版沒有 img/、檔案漏掉）時 onerror 把 <img>
   移掉，底下的 SVG 就自然露出來 —— 不需要任何 JS 接線，也不會出現破圖。 */
function artLayer(ex, opt){
  opt = opt || {};
  const svg = figureSVG(ex, opt);
  if(!ex.art) return svg;
  const cls = 'artimg' + (opt.small ? ' sm' : '');
  return `<span class="artwrap">${svg}<img class="${cls}" src="img/${ex.art}.webp" alt="${ex.n} 動作示意"
    loading="lazy" decoding="async" onerror="this.remove()"></span>`;
}

const ARROW_W=2.2;
function figureSVG(ex, opt){
  opt=opt||{};
  let f=ex.f||{v:'front',p:P({}),eq:[],ar:[]};
  if(opt.neutral) f={v:f.v, p:P({dy:-2}), eq:[], ar:[]};
  const p=f.p, j=joints(p), s=j._s;
  const pri=new Set(ex.pri||[]), sec=new Set(ex.sec||[]);
  const reg=id=>M[id]?M[id][1]:null;
  const has=(set,r)=>[...set].some(id=>reg(id)===r);
  const tone=r=>has(pri,r)?'hi':(has(sec,r)?'lo':'');

  // torso group transform
  const td=j._td, ang=Math.atan2(td.x,-td.y)*180/Math.PI;
  const tPri=[...pri].filter(id=>reg(id)==='torso');
  const tSec=[...sec].filter(id=>reg(id)==='torso');

  const bw=7.4*s, lw=8.6*s;
  const body=[
    // legs
    seg(j.hipL,j.kneeL,lw,'lm'), seg(j.kneeL,j.footL,lw*.82,'lm'),
    seg(j.hipR,j.kneeR,lw,'lm'), seg(j.kneeR,j.footR,lw*.82,'lm'),
    // torso base
    `<g transform="translate(${j.pelvis.x},${j.pelvis.y}) rotate(${r1(ang)}) scale(${s})"><path class="lm2" d="${TORSO_OUT}"/></g>`,
    // arms
    seg(j.shoulderL,j.elbowL,bw,'lm'), seg(j.elbowL,j.handL,bw*.84,'lm'),
    seg(j.shoulderR,j.elbowR,bw,'lm'), seg(j.elbowR,j.handR,bw*.84,'lm'),
    `<circle class="lm2" cx="${j.head.x}" cy="${j.head.y}" r="${r1(L.hd*s)}"/>`
  ].join('');

  const hi=[];
  const put=(a,b,w,cls)=>hi.push(seg(a,b,w,cls));
  const t2=(r,fn)=>{ const t=tone(r); if(t) fn(t==='hi'?'mh':'ms'); };
  t2('upperarm',c=>{ put(j.shoulderL,j.elbowL,bw*.78,c); put(j.shoulderR,j.elbowR,bw*.78,c); });
  t2('forearm', c=>{ put(j.elbowL,j.handL,bw*.66,c); put(j.elbowR,j.handR,bw*.66,c); });
  t2('thigh',   c=>{ put(j.hipL,j.kneeL,lw*.76,c); put(j.hipR,j.kneeR,lw*.76,c); });
  t2('shank',   c=>{ put(j.kneeL,j.footL,lw*.64,c); put(j.kneeR,j.footR,lw*.64,c); });
  const cf=c=>c==='mh'?'mhf':'msf';
  t2('shoulder',c=>{ hi.push(`<circle class="${cf(c)}" cx="${j.shoulderL.x}" cy="${j.shoulderL.y}" r="${r1(5.2*s)}"/>`);
                     hi.push(`<circle class="${cf(c)}" cx="${j.shoulderR.x}" cy="${j.shoulderR.y}" r="${r1(5.2*s)}"/>`); });
  t2('hip',     c=>{ hi.push(`<circle class="${cf(c)}" cx="${j.hipL.x}" cy="${r1(j.hipL.y+2)}" r="${r1(5.4*s)}"/>`);
                     hi.push(`<circle class="${cf(c)}" cx="${j.hipR.x}" cy="${r1(j.hipR.y+2)}" r="${r1(5.4*s)}"/>`); });
  if(tPri.length||tSec.length){
    hi.push(`<g transform="translate(${j.pelvis.x},${j.pelvis.y}) rotate(${r1(ang)}) scale(${s})">`
      + torsoPaths(tSec,'msf') + torsoPaths(tPri,'mhf') + `</g>`);
  }

  const eqs=(f.eq||[]).map(k=>gear(k,j)).join('');
  const ars=opt.arrows===false?'':(f.ar||[]).map(a=>{
    const anchor=j[a.at]||j.center;
    return arrow(anchor,a.d,(a.l||20)*s,(a.c||0)*s,ARROW_W);
  }).join('');

  const cls='fig'+(opt.small?' sm':'');
  return `<svg class="${cls}" viewBox="0 0 100 145" role="img" aria-label="${ex.n} 動作示意"
    stroke-linecap="round" stroke-linejoin="round">${eqs}${body}${hi}${ars}</svg>`;
}
</script>

<style>
svg.fig .lm{stroke:var(--fig);fill:none}
svg.fig .lm2{fill:var(--fig);stroke:none}
svg.fig .mh{stroke:var(--accent);fill:none}
svg.fig .ms{stroke:var(--accent);opacity:.34;fill:none}
svg.fig .mhf{fill:var(--accent);stroke:none}
svg.fig .msf{fill:var(--accent);opacity:.3;stroke:none}
svg.fig .eq{stroke:var(--figLine);fill:none}
svg.fig .eqf{fill:var(--figLine);stroke:none}
svg.fig .eqf2{stroke:var(--figLine);opacity:.7;fill:none}
svg.fig .eqf3{stroke:var(--figLine);opacity:.45;fill:none;stroke-dasharray:3 4}
svg.fig .cab{stroke:var(--figLine);opacity:.75;fill:none}
svg.fig .ar{stroke:var(--accent2);fill:none;opacity:.95}
svg.fig .arh{fill:var(--accent2);stroke:none;opacity:.95}
svg.fig.sm .ar,svg.fig.sm .arh{opacity:.85}
.artwrap{position:relative;display:block;width:100%;height:100%}
.artwrap svg.fig{position:absolute;inset:0;width:100%;height:100%}
.artimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
</style>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════
   3. 資料層
   ═══════════════════════════════════════════════════════ */
/* localStorage 不是「一定存在」的東西：沙箱 iframe 會直接丟 SecurityError，
   無痕模式與封鎖網站資料的設定也會。舊版把錯誤靜靜吞掉，結果是使用者以為
   有存、隔天打開全空。這一層負責問清楚「到底能不能存」，並在不能存的時候
   讓 App 繼續可用但大聲說出來。 */
const KEY='backyard_gym_v1', BAK=KEY+'_bak';
const Store=(()=>{
  let ok=false, why='', mem=Object.create(null);
  try{
    const k=KEY+'_probe', v=String(Date.now());
    localStorage.setItem(k,v);
    ok = localStorage.getItem(k)===v;
    localStorage.removeItem(k);
    if(!ok) why='這個瀏覽器寫得進去卻讀不回來';
  }catch(e){
    ok=false;
    why = (e&&(e.name==='QuotaExceededError'||e.code===22))
      ? '瀏覽器的儲存空間已經滿了'
      : '這個環境不允許網頁保存資料（沙箱或無痕模式）';
  }
  return {
    get ok(){return ok;}, get why(){return why;},
    read(k){ try{ return ok?localStorage.getItem(k):(k in mem?mem[k]:null); }catch(_){ return null; } },
    write(k,v){
      if(!ok){ mem[k]=v; return false; }
      try{ localStorage.setItem(k,v); return true; }
      catch(e){
        ok=false; mem[k]=v;
        why = (e&&(e.name==='QuotaExceededError'||e.code===22))
          ? '瀏覽器的儲存空間已經滿了，新的紀錄寫不進去'
          : '瀏覽器拒絕了寫入';
        return false;
      }
    },
    size(){ try{ return ok?((localStorage.getItem(KEY)||'').length):0; }catch(_){ return 0; } }
  };
})();
let lastSaved=null;

const uid=()=>Math.random().toString(36).slice(2,9);
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseISO=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c);};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const WD=['日','一','二','三','四','五','六'];

const TPL_SEED=[
  {name:'推日 · 胸肩三頭', accent:'#D98B45', ids:['bench','inclinedb','ohp','lateral','pushdown']},
  {name:'拉日 · 背二頭',   accent:'#5D91AA', ids:['deadlift','pullup','row','facepull','bbcurl']},
  {name:'腿日 · 下肢',     accent:'#7E9B5A', ids:['squat','rdl','legpress','lunge','calfraise','plank']}
];
function mkEntry(exId){
  const e=BYID[exId]; if(!e) return null;
  const [ns,nr,rest]=e.d;
  return {id:uid(), ex:exId, rest, sets:Array.from({length:ns},()=>({w:null,r:nr,aw:null,ar:null,ok:false}))};
}
function mkTemplate(t){ return {id:uid(), name:t.name, accent:t.accent, entries:t.ids.map(mkEntry).filter(Boolean)}; }

let S, recovered=false;
function parseState(raw){
  try{ const o=JSON.parse(raw||'null'); return (o&&o.version===1&&o.days)?o:null; }catch(_){ return null; }
}
function load(){
  recovered=false;
  let s=parseState(Store.read(KEY));
  if(!s){ const b=parseState(Store.read(BAK)); if(b){ s=b; recovered=true; } }
  if(!s){
    S={version:1, settings:{unit:'kg'}, days:{}, templates:TPL_SEED.map(mkTemplate), custom:[], manualMax:{}, bakAt:0};
    S.days[iso(new Date())]={entries:S.templates[0].entries.map(cloneEntry)};
    save();
  } else {
    S=s;
    S.settings=S.settings||{unit:'kg'};
    S.days=S.days||{}; S.templates=S.templates||[]; S.custom=S.custom||[]; S.manualMax=S.manualMax||{};
    // 舊版把手動最大重量存成單一數字，補上次數欄位（數字視為 1RM）
    for(const k in S.manualMax){
      const v=S.manualMax[k];
      if(typeof v==='number') S.manualMax[k]= v>0 ? {w:v,r:1} : undefined;
      if(!S.manualMax[k]||!(S.manualMax[k].w>0)) delete S.manualMax[k];
    }
    S.custom.forEach(c=>{ if(!BYID[c.id]) { DB.push(c); BYID[c.id]=c; } });
    if(recovered) save();   // 把回復後的內容寫回主檔，別讓壞掉的主檔留著
  }
}
function save(){
  // 存檔前留一份「上一個好的狀態」，主檔壞掉還救得回來。
  // 以時間節流（10 分鐘）而不是以天：一天一次的快照對訓練當下沒有意義，
  // 剛記完的幾組會整組不見。備份不存在時一律補寫。
  if(Store.ok){
    const prev=Store.read(KEY), now=Date.now();
    if(prev && (!Store.read(BAK) || !S.bakAt || now-S.bakAt > 600000)){
      Store.write(BAK,prev);
      S.bakAt=now;
    }
  }
  Store.write(KEY,JSON.stringify(S));
  lastSaved=new Date();
  updateWarn();
}
function updateWarn(){
  const el=$('warn'); if(!el) return;
  if(Store.ok){ el.hidden=true; return; }
  el.hidden=false;
  $('warnWhy').textContent=Store.why+'，關掉分頁就會消失。請立刻匯出備份。';
}
function cloneEntry(en){
  return {id:uid(), ex:en.ex, rest:en.rest,
    sets:en.sets.map(s=>({w:s.w, r:s.r, aw:null, ar:null, ok:false,
      ...(s.amrap?{amrap:true}:{}), ...(s.warm?{warm:true}:{})}))};
}
function dayOf(k){ return S.days[k]||{entries:[]}; }
function ensureDay(k){ if(!S.days[k]) S.days[k]={entries:[]}; return S.days[k]; }
function pruneDay(k){ if(S.days[k]&&!S.days[k].entries.length) delete S.days[k]; }

/* 單位換算：內部一律 kg */
const KGLB=2.2046226;
const u=()=>S.settings.unit;
const toU=kg=>kg==null?null:(u()==='kg'?kg:kg*KGLB);
const toKg=v=>v==null?null:(u()==='kg'?v:v/KGLB);
function fmt(n,dp){ if(n==null||!isFinite(n)) return '–'; const r=Math.round(n*(dp?10:1))/(dp?10:1); return String(r).replace(/\.0$/,''); }
const dispW=kg=>fmt(toU(kg),true);

/* 由所有紀錄推導最佳成績 */
/* Epley 在高次數會嚴重高估：力竭組做到 65kg×18 會算出 1RM 104kg，
   然後污染之後所有配重。超過這個次數的組只算「最大重量」，不列入 1RM 推估。 */
const E1_MAX_REPS = 12;
const epley = (kg,rp) => kg*(1+rp/30);

function bestOf(exId, before){
  let w=0,e1=0,wd=null,ed=null,lastDate=null,lastSets=null;
  for(const k of Object.keys(S.days)){
    for(const en of S.days[k].entries){
      if(en.ex!==exId) continue;
      let any=false;
      for(const st of en.sets){
        if(!st.ok||st.warm) continue;          // 熱身組不算紀錄
        const kg=st.aw!=null?st.aw:st.w, rp=st.ar!=null?st.ar:st.r;
        if(!kg||!rp) continue;
        any=true;
        if(kg>w){w=kg;wd=k;}
        if(rp<=E1_MAX_REPS){
          const e=epley(kg,rp);
          if(e>e1){e1=e;ed=k;}
        }
      }
      if(any&&(!before||k<before)&&(!lastDate||k>lastDate)){
        lastDate=k; lastSets=en.sets.filter(s=>s.ok&&!s.warm);
      }
    }
  }
  // 手動輸入的最大重量同樣要參與 1RM 推估，否則沒做過任何一組就永遠拿不到配重建議
  const mm=S.manualMax[exId];
  if(mm&&mm.w>0){
    if(mm.w>w){ w=mm.w; wd=null; }
    const me=epley(mm.w, Math.min(mm.r||1, E1_MAX_REPS));
    if(me>e1){ e1=me; ed=null; }
  }
  return {w:w||null,e1:e1||null,wd,ed,lastDate,lastSets};
}

/* ═══════════════════════════════════════════════════════

const $=id=>document.getElementById(id);
let sel=iso(new Date());
let weekAnchor=iso(new Date());

function weekStart(k){ const d=parseISO(k); return addDays(d,-((d.getDay()+6)%7)); } // 週一起始

function renderWeek(){
  const ws=weekStart(weekAnchor), today=iso(new Date());
  const mid=addDays(ws,3);
  $('monthLbl').innerHTML=`${mid.getFullYear()} 年 ${mid.getMonth()+1} 月<small>第 ${Math.ceil((mid.getDate())/7)} 週</small>`;
  $('btnToday').hidden=(sel===today);
  const box=$('week'); box.innerHTML='';
  for(let i=0;i<7;i++){
    const d=addDays(ws,i), k=iso(d), dd=dayOf(k);
    const total=dd.entries.reduce((a,e)=>a+e.sets.length,0);
    const done=dd.entries.reduce((a,e)=>a+e.sets.filter(s=>s.ok).length,0);
    const b=document.createElement('button');
    b.className='day'+(k===sel?' sel':'')+(k===today?' today':'');
    b.innerHTML=`<span class="wd">${WD[d.getDay()]}</span><span class="dd num">${d.getDate()}</span>
      <span class="dot ${total===0?'none':(done===total?'full':'')}"></span>`;
    b.onclick=()=>{ sel=k; weekAnchor=k; renderAll(); };
    box.appendChild(b);
  }
}

function ringSVG(done,total){
  const r=15, C=2*Math.PI*r, pct=total?done/total:0;
  const arc=done>0?`<circle cx="19" cy="19" r="${r}" fill="none" stroke="${done===total?'var(--ok)':'var(--accent)'}" stroke-width="3"
      stroke-dasharray="${(C*pct).toFixed(1)} ${C.toFixed(1)}" stroke-linecap="round" transform="rotate(-90 19 19)"/>`:'';
  return `<svg class="ring ${total&&done===total?'done':''}" viewBox="0 0 38 38">
    <circle cx="19" cy="19" r="${r}" fill="none" stroke="var(--line2)" stroke-width="3"/>${arc}
    <text x="19" y="19" text-anchor="middle" dominant-baseline="central" class="num">${done}/${total}</text></svg>`;
}

function schemeLine(en){
  const e=BYID[en.ex]; const ru=e&&e.unitReps||'下';
  const work=en.sets.filter(s=>!s.warm);            // 摘要只講正式組
  const ws=work.map(s=>s.aw!=null?s.aw:s.w).filter(v=>v!=null&&v>0);
  const rs=work.map(s=>s.ar!=null?s.ar:s.r).filter(v=>v!=null);
  const same=v=>v.length&&v.every(x=>x===v[0]);
  const rTxt=same(rs)?`${rs[0]}`:(rs.length?`${Math.min(...rs)}–${Math.max(...rs)}`:'–');
  const tail=work.some(s=>s.amrap)?'<span style="color:var(--accent)">＋力竭</span>':'';
  if(!ws.length) return `<b>${work.length}</b> 組 × <b>${rTxt}</b> ${ru} ${tail} · <span style="color:var(--text3)">未設重量</span>`;
  const wTxt=same(ws)?dispW(ws[0]):`${dispW(Math.min(...ws))}–${dispW(Math.max(...ws))}`;
  return `<b>${work.length}</b> 組 × <b>${rTxt}</b> ${ru} @ <b>${wTxt}</b> ${u()} ${tail}`;
}

function renderDay(){
  const d=parseISO(sel), k=sel, dd=dayOf(k), today=iso(new Date());
  const rel=k===today?'今天':(k===iso(addDays(new Date(),1))?'明天':(k===iso(addDays(new Date(),-1))?'昨天':''));
  const parts=[...new Set(dd.entries.map(e=>BYID[e.ex]&&BYID[e.ex].part).filter(Boolean))];
  const setsAll=dd.entries.reduce((a,e)=>a+e.sets.length,0);
  const setsDone=dd.entries.reduce((a,e)=>a+e.sets.filter(s=>s.ok).length,0);
  let vol=0;
  // 熱身組不計入訓練總量，否則 40kg×8 的暖身會把數字灌水
  dd.entries.forEach(e=>e.sets.forEach(s=>{ if(s.ok&&!s.warm){ const w=s.aw!=null?s.aw:s.w, r=s.ar!=null?s.ar:s.r; if(w&&r) vol+=w*r; }}));

  let h=`<div class="dayhead">
    <div class="dayttl serif"><span class="wk">${rel||'星期'+WD[d.getDay()]}${rel?' · 星期'+WD[d.getDay()]:''}</span>${d.getMonth()+1} 月 ${d.getDate()} 日</div>
    <div class="focus">${parts.map(p=>`<span class="ptag" style="color:${PARTS[p].c};background:${PARTS[p].c}22">${PARTS[p].n}</span>`).join('')}</div>
  </div>`;

  if(dd.entries.length){
    h+=`<div class="stats">
      <div class="stat"><div class="v num">${dd.entries.length}<em>項</em></div><div class="k">動作</div></div>
      <div class="stat ${setsDone===setsAll?'done':''}"><div class="v num">${setsDone}<em>/${setsAll}</em></div><div class="k">完成組數</div></div>
      <div class="stat"><div class="v num">${fmt(toU(vol))}<em>${u()}</em></div><div class="k">訓練總量</div></div>
    </div><div class="cards">`;
    dd.entries.forEach(en=>{
      const e=BYID[en.ex]; if(!e) return;
      const done=en.sets.filter(s=>s.ok).length;
      h+=`<button class="card ${done===en.sets.length?'complete':''}" data-entry="${en.id}">
        <span class="thumb" data-intro="${e.id}">${artLayer(e,{small:true})}</span>
        <span class="cbody">
          <span class="cname">${e.n}</span>
          <span class="cmeta"><i class="cdot" style="background:${PARTS[e.part].c}"></i><span class="cequip">${PARTS[e.part].n} · ${EQ[e.eq]}</span></span>
          <span class="cscheme num">${schemeLine(en)}</span>
        </span>
        ${ringSVG(done,en.sets.length)}
      </button>`;
    });
    h+=`</div><div class="dayfoot">
      <button class="btn gho" id="saveTpl">存成範本</button>
      <button class="btn gho" id="clearDay">清空本日</button>
    </div>`;
  } else {
    h+=`<div class="empty">
      <h3>這天還沒有課表</h3>
      <p>套用一份範本快速開始，<br>或從動作庫挑選今天想練的動作。</p>
      <div class="row">
        <button class="btn pri" id="emptyTpl">套用範本</button>
        <button class="btn" id="emptyLib">從動作庫加入</button>
      </div>
    </div>`;
  }
  $('main').innerHTML=h;

  $('main').querySelectorAll('.card').forEach(c=>{
    c.onclick=ev=>{
      const t=ev.target.closest('[data-intro]');
      if(t){ ev.stopPropagation(); openIntro(t.dataset.intro); return; }
      openDetail(c.dataset.entry);
    };
  });
  const on=(id,fn)=>{const el=$(id); if(el) el.onclick=fn;};
  on('emptyTpl',openTemplates); on('emptyLib',openLibrary);
  on('saveTpl',saveAsTemplate); on('clearDay',clearDay);
}
function renderAll(){ renderWeek(); renderDay(); }

/* ═══════════════════════════════════════════════════════
   5. Sheet 基礎

let sheetStack=[];
function openSheet(title,html,foot,after){
  $('sheetTtl').textContent=title;
  $('sheetBody').innerHTML=html;
  $('sheetBody').scrollTop=0;
  const f=$('sheetFoot');
  if(foot){ f.hidden=false; f.innerHTML=foot; } else { f.hidden=true; f.innerHTML=''; }
  $('scrim').classList.add('on'); $('sheet').classList.add('on');
  document.body.style.overflow='hidden';
  if(after) after();
}
function closeSheet(){
  $('scrim').classList.remove('on'); $('sheet').classList.remove('on');
  document.body.style.overflow='';
  sheetStack=[];
}
$('scrim').onclick=closeSheet; $('sheetClose').onclick=closeSheet;

let toastT;
/* 第二個參數可帶一個動作（例如「復原」）。破壞性操作一律要給得回去。 */
function toast(msg, action){
  const t=$('toast');
  clearTimeout(toastT);
  if(action){
    t.innerHTML=`<span>${msg}</span><button class="tact">${action.label}</button>`;
    t.querySelector('.tact').onclick=()=>{ t.classList.remove('on'); action.run(); };
  } else {
    t.textContent=msg;
  }
  t.classList.add('on');
  toastT=setTimeout(()=>t.classList.remove('on'), action?5200:1900);
}

/* ═══════════════════════════════════════════════════════
   6. 動作詳情
   ═══════════════════════════════════════════════════════ */
function findEntry(eid){
  const dd=dayOf(sel);
  return dd.entries.find(e=>e.id===eid);
}
function openDetail(eid){
  const en=findEntry(eid); if(!en) return;
  const e=BYID[en.ex]; if(!e) return;
  const b=bestOf(e.id, sel);
  const ru=e.unitReps||'下';
  const lastTxt=b.lastDate
    ? `${parseISO(b.lastDate).getMonth()+1}/${parseISO(b.lastDate).getDate()}　${b.lastSets.map(s=>`${dispW(s.aw!=null?s.aw:s.w)}×${s.ar!=null?s.ar:s.r}`).join('、')}`
    : '尚無完成紀錄';

  const html=`
  <div class="dtop">
    <div class="dfig" data-intro="${e.id}" role="button" tabindex="0">${artLayer(e)}<span class="hint">看動作說明</span></div>
    <div class="prgrid">
      <div class="prcell hi"><div class="k">最大重量</div><div class="v num">${dispW(b.w)}<em>${u()}</em></div></div>
      <div class="prcell"><div class="k">估算 1RM</div><div class="v num">${dispW(b.e1)}<em>${u()}</em></div></div>
      <div class="lastlog"><span style="color:var(--text3)">上次</span><b class="num">${lastTxt}</b></div>
    </div>
  </div>

  <div class="sect">
    <div class="secth"><span class="lbl">今日組數</span><span class="rule"></span></div>
    <div class="sets" id="sets"></div>
    <button class="addset" id="addSet">＋ 新增一組</button>
  </div>

  <div class="sect">
    <div class="secth"><span class="lbl">重量組數搭配</span><span class="rule"></span></div>
    <div class="mix" id="mix"></div>
    <div class="mixnote" id="mixnote"></div>
  </div>

  <div class="sect">
    <div class="secth"><span class="lbl">組間休息</span><span class="rule"></span></div>
    <div class="restrow" id="rest"></div>
  </div>`;

  const foot=`<button class="btn dgr" id="delEntry">移出課表</button><button class="btn pri" id="doneDetail">完成</button>`;
  openSheet(e.n, html, foot, ()=>{
    drawSets(en,e,ru); drawMix(en,e,b,eid); drawRest(en);
    $('sheetBody').querySelector('[data-intro]').onclick=()=>openIntro(e.id,eid);
    $('addSet').onclick=()=>{
      const last=en.sets[en.sets.length-1]||{w:null,r:e.d[1]};
      en.sets.push({w:last.w,r:last.r,aw:null,ar:null,ok:false});
      save(); drawSets(en,e,ru,eid); renderAll();
    };
    $('delEntry').onclick=()=>{
      const dd=ensureDay(sel);
      dd.entries=dd.entries.filter(x=>x.id!==eid);
      pruneDay(sel); save(); closeSheet(); renderAll(); toast('已移出課表');
    };
    $('doneDetail').onclick=closeSheet;
  });
}

function refreshTop(en,e,eid){
  const b=bestOf(e.id, sel);
  const vs=$('sheetBody').querySelectorAll('.prcell .v');
  if(vs[0]) vs[0].innerHTML=`${dispW(b.w)}<em>${u()}</em>`;
  if(vs[1]) vs[1].innerHTML=`${dispW(b.e1)}<em>${u()}</em>`;
  drawMix(en,e,b,eid);
}
function drawSets(en,e,ru,eid){
  const box=$('sets'); if(!box) return;
  let n=0;                                  // 正式組的編號，熱身組不佔號
  box.innerHTML=en.sets.map((s,i)=>{
    const w=s.aw!=null?s.aw:s.w, r=s.ar!=null?s.ar:s.r;
    const no=s.warm?'熱':String(++n);
    // 力竭組沒有目標次數，做完才填實際做到幾下
    const rPlace=s.amrap?'力竭':'–';
    return `<div class="setrow ${s.ok?'on':''} ${s.warm?'warm':''} ${s.amrap?'amrap':''}" data-i="${i}">
      <span class="setno num">${no}</span>
      <span class="fld"><input type="number" inputmode="decimal" step="0.5" min="0" data-f="w" value="${w!=null?fmt(toU(w),true):''}" placeholder="–" aria-label="第${no}組重量"><u>${u()}</u></span>
      <span class="setx">×</span>
      <span class="fld"><input type="number" inputmode="numeric" step="1" min="0" data-f="r" value="${r!=null?r:''}" placeholder="${rPlace}" aria-label="第${no}組次數"><u>${ru}</u></span>
      <button class="chk" data-a="ok" aria-label="標記完成"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></button>
      <button class="del" data-a="del" aria-label="刪除這組"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>`;
  }).join('');

  box.querySelectorAll('.setrow').forEach(row=>{
    const i=+row.dataset.i, s=en.sets[i];
    row.querySelectorAll('input').forEach(inp=>{
      inp.onchange=()=>{
        const v=inp.value===''?null:parseFloat(inp.value);
        if(inp.dataset.f==='w'){ const kg=v==null?null:toKg(v); if(s.ok) s.aw=kg; else { s.w=kg; s.aw=null; } }
        else { if(s.ok) s.ar=v; else { s.r=v; s.ar=null; } }
        save(); refreshTop(en,e,eid); renderAll();
      };
      inp.onfocus=()=>inp.select();
    });
    row.querySelector('[data-a="ok"]').onclick=()=>{
      s.ok=!s.ok;
      if(s.ok){ if(s.aw==null) s.aw=s.w; if(s.ar==null) s.ar=s.r; }
      const needReps = s.ok && s.amrap && s.ar==null;   // 力竭組沒有目標次數，得問實際做幾下
      save(); drawSets(en,e,ru,eid); refreshTop(en,e,eid); renderAll();
      if(needReps){
        const inp=$('sets').querySelector(`.setrow[data-i="${i}"] input[data-f="r"]`);
        if(inp){ inp.focus(); toast('力竭組請填實際做到幾下'); }
      }
    };
    row.querySelector('[data-a="del"]').onclick=()=>{
      if(en.sets.length<=1){ toast('至少保留一組'); return; }
      en.sets.splice(i,1); save(); drawSets(en,e,ru,eid); refreshTop(en,e,eid); renderAll();
    };
  });
}

/* 每個型態是一份「每組獨立」的清單，不是 N 組相同重量。
   直線組／正金字塔／遞減組要加的話，在這裡多一筆就好，不用動其他地方。 */
const SCHEMES=[
  {g:'反向金字塔', s:'最重的先做，逐組減重加次數',
   sets:[{pct:.85,reps:5},{pct:.78,reps:7},{pct:.72,reps:9}]},
  {g:'增肌＋力竭', s:'前兩組固定，最後一組做到做不動',
   sets:[{pct:.72,reps:10},{pct:.72,reps:10},{pct:.65,amrap:true}]}
];
const WARMUP={g:'熱身組', s:'插到最前面，不計入總量與 PR',
  sets:[{pct:.40,reps:8},{pct:.55,reps:5},{pct:.70,reps:3}]};

const wStep=()=>u()==='kg'?2.5:5;
// 百分比 → 實際重量（以顯示單位四捨五入到槓片刻度，再轉回 kg 儲存）
function schemeWeight(e1kg,pct){
  const st=wStep();
  return toKg(Math.max(st, Math.round(toU(e1kg)*pct/st)*st));
}
function buildSets(spec,e1kg,warm){
  return spec.map(x=>({
    w:schemeWeight(e1kg,x.pct), r:x.amrap?null:x.reps,
    aw:null, ar:null, ok:false,
    ...(x.amrap?{amrap:true}:{}), ...(warm?{warm:true}:{})
  }));
}
const setLabel=s=>`${dispW(s.w)}${u()}×${s.amrap?'力竭':s.r}`;

/* 已打勾的組是真實訓練紀錄，永遠不動它，只換掉還沒做的。 */
function applySets(en,e,eid,make,msg){
  const before=JSON.parse(JSON.stringify(en.sets));
  make();
  save(); drawSets(en,e,e.unitReps||'下',eid); refreshTop(en,e,eid); renderAll();
  toast(msg,{label:'復原',run:()=>{
    en.sets=before; save(); drawSets(en,e,e.unitReps||'下',eid); refreshTop(en,e,eid); renderAll();
  }});
}

function drawMix(en,e,b,eid){
  const box=$('mix'), note=$('mixnote'); if(!box) return;
  if(!b.e1){
    box.innerHTML=`<div class="mixr" style="display:block"><span class="g">還沒有配重建議</span><br>
      <span class="s">填入重量並打勾任一組，或到動作說明頁設定最大重量，這裡就會算出配重</span></div>`;
    note.textContent='';
    return;
  }
  const rows=SCHEMES.map((m,i)=>{
    const preview=buildSets(m.sets,b.e1).map(setLabel).join(' · ');
    return `<button class="mixr" data-i="${i}">
      <span><span class="g">${m.g}</span><br><span class="s">${m.s}</span>
      <br><span class="plan num">${preview}</span></span></button>`;
  }).join('');
  const warmPrev=buildSets(WARMUP.sets,b.e1,true).map(setLabel).join(' · ');
  box.innerHTML=rows+`<button class="mixr" data-warm="1">
    <span><span class="g">＋ ${WARMUP.g}</span><br><span class="s">${WARMUP.s}</span>
    <br><span class="plan num">${warmPrev}</span></span></button>`;

  note.innerHTML=`依估算 1RM <b class="num">${dispW(b.e1)} ${u()}</b> 推算，四捨五入到 ${wStep()}${u()}。
    套用只會換掉<b>還沒打勾</b>的組，已完成的紀錄不動。`;

  box.querySelectorAll('.mixr').forEach(btn=>{
    btn.onclick=()=>{
      if(btn.dataset.warm){
        applySets(en,e,eid,()=>{
          en.sets=buildSets(WARMUP.sets,b.e1,true).concat(en.sets.filter(s=>!s.warm));
        },'已插入熱身組');
        return;
      }
      const m=SCHEMES[+btn.dataset.i];
      applySets(en,e,eid,()=>{
        const keep=en.sets.filter(s=>s.ok);
        en.sets=keep.concat(buildSets(m.sets,b.e1));
      },`已套用${m.g}`);
    };
  });
}
function drawRest(en){
  const box=$('rest'); if(!box) return;
  const opts=[45,60,90,120,150,180];
  box.innerHTML=opts.map(v=>`<button class="pill ${en.rest===v?'on':''}" data-v="${v}">${v>=60?(v/60)+' 分':v+' 秒'}</button>`).join('');
  box.querySelectorAll('.pill').forEach(p=>p.onclick=()=>{ en.rest=+p.dataset.v; save(); drawRest(en); });
}

/* 手動設定最大重量。多數人知道「80 公斤能做 5 下」，卻不知道自己真正的 1RM，
   而且單次極限測試有風險 —— 所以預設收「重量 × 次數」再換算，也允許直接填 1RM。 */
function drawMaxForm(exId,e,backTo){
  const box=$('maxBox'); if(!box) return;
  const cur=S.manualMax[exId]||{};
  box.innerHTML=`
    <div class="maxform">
      <div class="restrow" style="margin-bottom:9px">
        <button class="pill on" data-mode="reps">重量 × 次數</button>
        <button class="pill" data-mode="orm">直接填 1RM</button>
      </div>
      <div class="maxrow">
        <span class="fld"><input type="number" inputmode="decimal" step="0.5" min="0" id="mxW"
          value="${cur.w?fmt(toU(cur.w),true):''}" placeholder="–" aria-label="重量"><u>${u()}</u></span>
        <span class="setx" id="mxX">×</span>
        <span class="fld" id="mxRwrap"><input type="number" inputmode="numeric" step="1" min="1" max="12" id="mxR"
          value="${cur.r||''}" placeholder="–" aria-label="次數"><u>下</u></span>
      </div>
      <div class="mixnote" id="mxOut"></div>
      <div class="restrow" style="margin-top:10px">
        <button class="btn pri" id="mxSave">儲存</button>
        ${cur.w?`<button class="btn dgr" id="mxDel">清除</button>`:''}
        <button class="btn gho" id="mxCancel">取消</button>
      </div>
    </div>`;

  let mode = (cur.r===1||!cur.w) && cur.r===1 ? 'orm' : 'reps';
  const setMode=m=>{
    mode=m;
    box.querySelectorAll('[data-mode]').forEach(p=>p.classList.toggle('on',p.dataset.mode===m));
    $('mxX').style.visibility = m==='orm'?'hidden':'visible';
    $('mxRwrap').style.visibility = m==='orm'?'hidden':'visible';
    calc();
  };
  function calc(){
    const w=parseFloat($('mxW').value), r=mode==='orm'?1:parseInt($('mxR').value,10);
    const out=$('mxOut');
    if(!isFinite(w)||w<=0){ out.textContent='填入重量後這裡會顯示換算結果。'; return; }
    if(mode!=='orm'&&(!isFinite(r)||r<1)){ out.textContent='再填次數就會換算成 1RM。'; return; }
    const rr=Math.min(mode==='orm'?1:r, E1_MAX_REPS);
    const e1=epley(toKg(w),rr);
    out.innerHTML = mode==='orm'
      ? `直接以 <b class="num">${fmt(w,true)} ${u()}</b> 當作 1RM。`
      : `<b class="num">${fmt(w,true)} ${u()} × ${r} 下</b> → 估算 1RM <b class="num">${dispW(e1)} ${u()}</b>`
        + (r>E1_MAX_REPS?`<br><span style="color:var(--warnText)">次數超過 ${E1_MAX_REPS} 下的換算會嚴重高估，已以 ${E1_MAX_REPS} 下計算。</span>`:'');
  }
  box.querySelectorAll('[data-mode]').forEach(p=>p.onclick=()=>setMode(p.dataset.mode));
  $('mxW').oninput=calc; $('mxR').oninput=calc;
  $('mxSave').onclick=()=>{
    const w=parseFloat($('mxW').value), r=mode==='orm'?1:parseInt($('mxR').value,10);
    if(!isFinite(w)||w<=0){ toast('請填入重量'); return; }
    if(mode!=='orm'&&(!isFinite(r)||r<1)){ toast('請填入次數'); return; }
    S.manualMax[exId]={w:toKg(w), r:mode==='orm'?1:r};
    save(); openIntro(exId,backTo); renderAll(); toast('已更新最大重量');
  };
  const del=$('mxDel');
  if(del) del.onclick=()=>{ delete S.manualMax[exId]; save(); openIntro(exId,backTo); renderAll(); toast('已清除手動設定'); };
  $('mxCancel').onclick=()=>{ box.innerHTML=''; };
  setMode(mode);
  $('mxW').focus();
}

function drawLib(){
  const list=$('libList'); if(!list) return;

function addToDay(ids){

let dlAvail=null;
async function initDownloads(){
  try{ dlAvail = (window.claude&&typeof window.claude.use==='function') ? await window.claude.use('downloads') : null; }
  catch(_){ dlAvail=null; }
}
// 檔名維持 ASCII：Chromium 下載時會把中文檔名整個丟掉，變成無副檔名的 "download"
function backupName(){ return `iron-log-backup-${iso(new Date())}.json`; }
async function exportBackup(){
  const data=JSON.stringify(S,null,2);
  if(dlAvail){
    try{ await dlAvail.save({filename:backupName(),data}); toast('已匯出'); return; }
    catch(err){ if(err&&err.code==='declined'){ toast('已取消匯出'); return; } }
  }
  try{
    const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));
    const a=document.createElement('a');
    a.href=url; a.download=backupName(); a.style.display='none';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    toast('已匯出備份檔');
  }catch(_){ toast('這個環境不能下載，請改用「顯示備份文字」'); }
}
function applyBackup(text){
  let o;
  try{ o=JSON.parse(text); }catch(_){ toast('備份格式不正確'); return; }
  if(!o||o.version!==1||!o.days){ toast('備份格式不正確'); return; }
  const days=Object.keys(o.days).length;
  if(!confirm(`還原會覆蓋目前所有資料，換成備份裡的 ${days} 天課表。確定嗎？`)) return;
  Store.write(KEY,JSON.stringify(o));
  load(); closeSheet(); renderAll(); updateWarn(); toast('已還原備份');
}
function openSettings(){
  const total=Object.keys(S.days).length;
  const logged=Object.values(S.days).reduce((a,d)=>a+d.entries.reduce((b,e)=>b+e.sets.filter(s=>s.ok).length,0),0);
  const html=`
  <div class="sect">
    <div class="secth"><span class="lbl">重量單位</span><span class="rule"></span></div>
    <div class="restrow">
      <button class="pill ${u()==='kg'?'on':''}" data-u="kg">公斤 kg</button>
      <button class="pill ${u()==='lb'?'on':''}" data-u="lb">磅 lb</button>
    </div>
    <div class="hintbox">紀錄一律以公斤儲存，切換單位只改變顯示與輸入方式，不會影響既有資料。</div>
  </div>
  <div class="sect" id="dataSect">
    <div class="secth"><span class="lbl">資料</span><span class="rule"></span></div>
    <div class="hintbox" style="margin-top:0">
      <div style="display:flex;align-items:center;gap:7px;margin-bottom:6px">
        <i style="width:7px;height:7px;border-radius:99px;flex:none;background:${Store.ok?'var(--ok)':'var(--warnText)'}"></i>
        <b style="color:var(--text)">${Store.ok?'保存正常':'無法保存'}</b>
        ${Store.ok?`<span style="margin-left:auto;font-size:11px">${lastSaved?`最後儲存 ${String(lastSaved.getHours()).padStart(2,'0')}:${String(lastSaved.getMinutes()).padStart(2,'0')}`:''} · ${(Store.size()/1024).toFixed(1)} KB</span>`:''}
      </div>
      ${Store.ok
        ? `目前有 <b>${total}</b> 天課表、<b>${logged}</b> 組完成紀錄。<br>資料只存在這台裝置的這個瀏覽器裡，換手機或清除瀏覽器資料就會消失，建議定期匯出備份。`
        : `${Store.why}。<br>目前的 <b>${total}</b> 天課表只存在記憶體裡，<b>關掉分頁就會全部消失</b>。請立刻用下面的按鈕匯出，換到一般瀏覽器分頁再還原。`}
    </div>
    <div class="restrow" style="margin-top:10px">
      <button class="btn ${Store.ok?'':'pri'}" id="expFile">匯出備份檔</button>
      <button class="btn" id="expText">顯示備份文字</button>
      <button class="btn" id="impFile">從檔案還原</button>
      <button class="btn" id="impText">貼上備份文字</button>
    </div>
    <input type="file" id="impInput" accept="application/json,.json" hidden>
    <div id="ioBox"></div>
  </div>
  <div class="sect">
    <div class="secth"><span class="lbl">危險操作</span><span class="rule"></span></div>
    <button class="btn dgr" id="wipe">清除全部資料</button>
  </div>`;
  openSheet('設定', html, `<button class="btn pri" id="setClose" style="flex:1">關閉</button>`, ()=>{
    $('setClose').onclick=closeSheet;
    $('sheetBody').querySelectorAll('[data-u]').forEach(p=>p.onclick=()=>{
      S.settings.unit=p.dataset.u; save(); openSettings(); renderAll();
    });
    const io=$('ioBox');
    $('expFile').onclick=exportBackup;
    $('expText').onclick=()=>{
      io.innerHTML=`<textarea class="backup" readonly id="ta">${JSON.stringify(S)}</textarea>
        <div class="hintbox" style="margin-top:6px">全選複製這段文字，存到你的備忘錄即可。</div>`;
      $('ta').focus(); $('ta').select();
    };
    $('impFile').onclick=()=>$('impInput').click();
    $('impInput').onchange=ev=>{
      const f=ev.target.files&&ev.target.files[0]; if(!f) return;
      const r=new FileReader();
      r.onload=()=>applyBackup(String(r.result));
      r.onerror=()=>toast('檔案讀取失敗');
      r.readAsText(f);
      ev.target.value='';
    };
    $('impText').onclick=()=>{
      io.innerHTML=`<textarea class="backup" id="ta" placeholder="把備份文字貼在這裡…"></textarea>
        <div class="restrow" style="margin-top:8px"><button class="btn pri" id="doImp">還原</button></div>`;
      $('doImp').onclick=()=>applyBackup($('ta').value);
    };
    $('wipe').onclick=()=>{
      if(!confirm('這會刪除全部課表、紀錄與範本，且無法復原。確定嗎？')) return;
      try{ localStorage.removeItem(KEY); localStorage.removeItem(BAK); }catch(_){}
      Store.write(KEY,''); load(); closeSheet(); renderAll(); toast('已清除全部資料');
    };
  });
}

/* ═══════════════════════════════════════════════════════
   10. 互動：FAB / 滑動 / 鍵盤
   ═══════════════════════════════════════════════════════ */
const fw=$('fabwrap');
$('fab').onclick=e=>{ e.stopPropagation(); fw.classList.toggle('open'); };
document.addEventListener('click',()=>fw.classList.remove('open'));
$('miniLib').onclick=e=>{e.stopPropagation();fw.classList.remove('open');openLibrary();};
$('miniTpl').onclick=e=>{e.stopPropagation();fw.classList.remove('open');openTemplates();};
$('miniCopy').onclick=e=>{e.stopPropagation();fw.classList.remove('open');openCopy();};
$('btnSettings').onclick=openSettings;
$('btnPrev').onclick=()=>{ weekAnchor=iso(addDays(parseISO(weekAnchor),-7)); sel=iso(addDays(parseISO(sel),-7)); renderAll(); };
$('btnNext').onclick=()=>{ weekAnchor=iso(addDays(parseISO(weekAnchor),7)); sel=iso(addDays(parseISO(sel),7)); renderAll(); };
$('btnToday').onclick=()=>{ sel=iso(new Date()); weekAnchor=sel; renderAll(); };

function shiftDay(n){
  sel=iso(addDays(parseISO(sel),n));
  if(iso(weekStart(sel))!==iso(weekStart(weekAnchor))) weekAnchor=sel;
  renderAll();
}
let tsx=0,tsy=0,tracking=false;
const mainEl=$('main');
mainEl.addEventListener('touchstart',e=>{
  if(e.touches.length!==1) return;
  tsx=e.touches[0].clientX; tsy=e.touches[0].clientY; tracking=true;
},{passive:true});
mainEl.addEventListener('touchend',e=>{
  if(!tracking) return; tracking=false;
  const t=e.changedTouches[0], dx=t.clientX-tsx, dy=t.clientY-tsy;
  if(Math.abs(dx)>52 && Math.abs(dx)>Math.abs(dy)*1.6) shiftDay(dx<0?1:-1);
},{passive:true});

document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea')) return;
  if($('sheet').classList.contains('on')){ if(e.key==='Escape') closeSheet(); return; }
  if(e.key==='ArrowLeft') shiftDay(-1);
  else if(e.key==='ArrowRight') shiftDay(1);
  else if(e.key==='t'||e.key==='T'){ sel=iso(new Date()); weekAnchor=sel; renderAll(); }
});

$('warnAct').onclick=()=>{
  openSettings();
  setTimeout(()=>{ const s=$('dataSect'); if(s) s.scrollIntoView({block:'start',behavior:'smooth'}); },60);
};

/* ── boot ─────────────────────────────────────────────── */
load();
renderAll();
updateWarn();
initDownloads();
if(recovered) setTimeout(()=>toast('主檔讀不到，已從每日備份回復'),500);

/* 健身房常常沒訊號 —— 讓頁面離線也打得開 */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
